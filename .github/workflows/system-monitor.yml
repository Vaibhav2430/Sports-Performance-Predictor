name: CourtCast system monitoring

on:
  schedule:
    - cron: '43 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courtcast-system-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install monitoring tools
        run: python -m pip install -r backend/requirements-backup.txt
      - name: Check saved job outcomes and API quota
        env:
          DATABASE_URL: ${{ secrets.COURTCAST_BACKUP_DATABASE_URL }}
          STORAGE_BACKEND: postgres
          # Enable this repository variable once the backend has always-on hosting.
          MONITOR_REQUIRE_SCHEDULER: ${{ vars.MONITOR_REQUIRE_SCHEDULER || 'false' }}
        run: python backend/monitoring.py
